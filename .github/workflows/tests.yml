name: tests

on:
  workflow_dispatch:
  push:
    branches: ["main", "feature/**"]
    paths:
      - ".github/workflows/**"
      - "bot.py"
      - "bridge.py"
      - "cloudflare/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "package.json"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/**"
      - "bot.py"
      - "bridge.py"
      - "cloudflare/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: telegram-bot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (3.11 / 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime and lint dependencies
        if: hashFiles('requirements.txt') != ''
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff
      - name: Compile Python sources
        if: hashFiles('requirements.txt') != ''
        run: python -m compileall -q bot.py bridge.py scripts tests
      - name: Lint Python sources
        if: hashFiles('requirements.txt') != ''
        run: python -m ruff check bot.py bridge.py scripts tests
      - name: Run Python unit tests
        if: hashFiles('requirements.txt') != ''
        run: python -m unittest discover -s tests -v

  dependency-audit:
    name: Python dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Audit resolved runtime dependencies
        if: hashFiles('requirements.txt') != ''
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --requirement requirements.txt

  worker-tests:
    name: Cloudflare Worker tests (Node.js 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Run Cloudflare Worker unit tests
        if: hashFiles('package.json') != '' && hashFiles('cloudflare/worker.js') != ''
        run: npm run test:worker
